<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="租盾 - 从入住到退租，全程守护你的押金。租房取证、费用追踪、押金维权一体化工具。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="租盾">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>租盾 · 租房取证 · 押金守护</title>
  <link rel="manifest" href="manifest.json">

  <!-- 首帧渲染前的品牌启动屏：避免加载字体 / 引擎时出现白屏 -->
  <style>
    html, body { margin: 0; height: 100%; background: #F5F7FB; }
    #zudun-splash {
      position: fixed; inset: 0; z-index: 9;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #F5F7FB; color: #0E1F3D;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      transition: opacity .35s ease;
    }
    #zudun-splash .logo {
      width: 72px; height: 72px; border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(160deg, #0F2A5E, #17427F);
      box-shadow: 0 18px 46px -12px rgba(14, 31, 61, .22);
    }
    #zudun-splash .logo svg { width: 34px; height: 34px; }
    #zudun-splash h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.4px; }
    #zudun-splash p { margin: 0; font-size: 13px; color: #6B7A99; }
    #zudun-splash .bar {
      width: 132px; height: 3px; border-radius: 2px;
      background: #E4E8F0; overflow: hidden;
    }
    #zudun-splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #2F6BFF, #12A150);
      animation: zudun-run 1.1s ease-in-out infinite;
    }
    @keyframes zudun-run {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
    #zudun-splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="zudun-splash">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6.2a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 4 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
    <h1>租盾</h1>
    <p>从入住到退租，全程守护你的押金</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // Flutter 首帧渲染完成后移除启动屏
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('zudun-splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 400);
    });

    (async function boot() {
      // 清理历史版本注册过的 Service Worker 与缓存，避免「刷新后仍是旧界面」
      try {
        if ('serviceWorker' in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (item) {
            return item.unregister();
          }));
        }
        if (window.caches && caches.keys) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (key) {
            return caches.delete(key);
          }));
        }
      } catch (error) {
        console.warn('清理旧缓存失败，可忽略：', error);
      }
      // 不传 serviceWorker 配置：应用不再注册 Service Worker
      _flutter.loader.load();
    })();
  </script>
</body>
</html>
