name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      - name: 静态检查（零问题门禁）
        run: flutter analyze

      - name: 单元 / 组件测试
        run: flutter test --reporter compact

      - name: Web 构建（确认可发布）
        run: flutter build web --release
